name: Bug report
description: Something in the equisdots stack does not work as expected.
title: "[bug] "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the stack is affected?
      options:
        - dots (install, update)
        - hyprland (configuration, scripts)
        - shell (bar, panels, widgets, editor)
        - davincix (wallpaper kernel, picker)
        - background (collection, interactive scenes)
        - palettes / theme-sync
        - timex / xturing / login
        - xwww (wallpaper daemon)
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem, including the exact text of any error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `dots doctor`, `hyprland --version` and `xwww --version`.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `dots update` and `dots doctor` before reporting.
          required: true
        - label: I searched the existing issues for the same problem.
          required: true
